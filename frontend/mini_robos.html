<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mini Robos · ChlearSakhaaOps AI</title>
    <script>document.documentElement.classList.toggle('dark-mode', localStorage.getItem('adoptima_theme') === 'dark');</script>
    <style>
        :root {
            --color-bg-page: #ffffff;
            --color-bg-sidebar: #fafaf9;
            --color-bg-card: #fafaf9;
            --color-bg-card-hover: #f5f5f4;
            --color-bg-input: #ffffff;
            --color-bg-modal: #ffffff;
            --color-bg-tooltip: #1c1917;

            --color-border: #e7e5e4;
            --color-border-strong: #d6d3d1;
            --color-border-input: #d6d3d1;
            --color-border-focus: #d97706;

            --color-text-primary: #1c1917;
            --color-text-secondary: #57534e;
            --color-text-muted: #a8a29e;
            --color-text-on-accent: #ffffff;
            --color-text-on-tooltip: #fafaf9;

            --color-accent: #d97706;
            --color-accent-hover: #b45309;
            --color-accent-light: #fef3c7;
            --color-accent-text: #92400e;

            --color-success: #059669;
            --color-success-light: #d1fae5;
            --color-success-text: #065f46;

            --color-danger: #dc2626;
            --color-danger-light: #fee2e2;
            --color-danger-text: #991b1b;

            --color-warning: #d97706;
            --color-warning-light: #fef3c7;
            --color-warning-text: #92400e;

            --color-info: #2563eb;
            --color-info-light: #dbeafe;
            --color-info-text: #1e40af;

            --color-purple: #7c3aed;
            --color-purple-light: #ede9fe;
            --color-purple-text: #5b21b6;

            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;

            --overlay-bg: rgba(0,0,0,0.4);
        }

        html.dark-mode {
            --color-bg-page: #131009;
            --color-bg-sidebar: #151310;
            --color-bg-card: #292524;
            --color-bg-card-hover: #33302e;
            --color-bg-input: #292524;
            --color-bg-modal: #292524;
            --color-bg-tooltip: #fafaf9;

            --color-border: #3d3937;
            --color-border-strong: #57534e;
            --color-border-input: #57534e;
            --color-border-focus: #f59e0b;

            --color-text-primary: #fafaf9;
            --color-text-secondary: #d6d3d1;
            --color-text-muted: #78716c;
            --color-text-on-accent: #ffffff;
            --color-text-on-tooltip: #1c1917;

            --color-accent: #f59e0b;
            --color-accent-hover: #d97706;
            --color-accent-light: rgba(245,158,11,0.12);
            --color-accent-text: #fbbf24;

            --color-success: #34d399;
            --color-success-light: rgba(52,211,153,0.12);
            --color-success-text: #6ee7b7;

            --color-danger: #f87171;
            --color-danger-light: rgba(248,113,113,0.12);
            --color-danger-text: #fca5a5;

            --color-warning: #fbbf24;
            --color-warning-light: rgba(251,191,36,0.12);
            --color-warning-text: #fde68a;

            --color-info: #60a5fa;
            --color-info-light: rgba(96,165,250,0.12);
            --color-info-text: #93bbfd;

            --color-purple: #a78bfa;
            --color-purple-light: rgba(167,139,250,0.12);
            --color-purple-text: #c4b5fd;

            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);

            --overlay-bg: rgba(0,0,0,0.6);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; background: var(--color-bg-page); color: var(--color-text-primary); font: 1rem/1.5 system-ui, sans-serif; }
        nav, main { width: min(100% - 2rem, 80rem); margin-inline: auto; }
        nav, .row, .filters, .actions, .timeline { display: flex; align-items: center; gap: .625rem; flex-wrap: wrap; }
        header { background: var(--color-bg-sidebar); border-bottom: 1px solid var(--color-border); padding-block: .875rem; }
        main { padding-block: 2rem 4rem; }
        h1, h2, h3, p { margin: 0; }
        h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); }
        h2 { font-size: 1.125rem; }
        h3 { font-size: .95rem; }
        a { color: var(--color-accent-text); text-underline-offset: .2em; }
        :focus-visible { outline: 3px solid var(--color-border-focus); outline-offset: 3px; }
        .muted, dt { color: var(--color-text-secondary); }
        .stack { display: grid; gap: 1rem; }
        .compact { gap: .625rem; }
        .panel, .agent-row { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-card); min-width: 0; padding: .875rem; }
        .agent-row { display: grid; grid-template-columns: minmax(13rem, 1.1fr) minmax(11rem, 1fr) minmax(10rem, .8fr) minmax(11rem, .8fr); gap: .75rem; }
        .agent-row > div { min-width: 0; overflow-wrap: anywhere; }
        .label { display: block; color: var(--color-text-secondary); font-size: .8125rem; }
        button, input, select, textarea { font: inherit; color: inherit; background: var(--color-bg-input); border: 1px solid var(--color-border-input); border-radius: var(--radius-sm); padding: .375rem .625rem; max-width: 100%; }
        textarea { width: 100%; resize: vertical; }
        button { cursor: pointer; background: var(--color-bg-card); }
        button:hover { background: var(--color-bg-card-hover); }
        button[aria-pressed="true"], button[aria-selected="true"] { border-color: var(--color-border-focus); background: var(--color-accent-light); color: var(--color-accent-text); }
        .primary { background: var(--color-accent-light); color: var(--color-accent-text); font-weight: 700; }
        label { display: grid; gap: .25rem; font-size: .875rem; }
        .filters { align-items: end; }
        .dot { display: inline-block; inline-size: .625rem; block-size: .625rem; border-radius: 50%; margin-right: .375rem; border: 1px solid var(--color-border-strong); background: var(--color-bg-sidebar); }
        .dot.on_track { background: var(--color-success); }
        .dot.missed, .dot.failing { background: var(--color-danger); }
        .dot.late { background: var(--color-warning); }
        .dot.paused { background: var(--color-info-light); }
        .square { margin: 0; border-radius: 2px; }
        .timeline { gap: .18rem; }
        .badge { border-radius: var(--radius-sm); padding: .25rem .5rem; color: var(--color-accent-text); background: var(--color-accent-light); font-size: .8125rem; }
        dl { display: grid; grid-template-columns: minmax(6rem, 1fr) minmax(0, 3fr); gap: .375rem .75rem; margin: 0; }
        dd { margin: 0; overflow-wrap: anywhere; }
        .diff { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--color-bg-page); padding: .625rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); margin: .25rem 0; }
        .scroll { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; font-size: .875rem; }
        th, td { text-align: left; vertical-align: top; padding: .5rem; border-bottom: 1px solid var(--color-border); overflow-wrap: anywhere; }
        dialog { border: 1px solid var(--color-border); border-radius: var(--radius-lg); background: var(--color-bg-page); color: var(--color-text-primary); width: min(44rem, 100% - 2rem); }
        dialog::backdrop { background: var(--overlay-bg); }
        #notice:empty { display: none; }
        @media (max-width: 64rem) { .agent-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 36rem) { .agent-row { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body>
    <header><nav aria-label="Breadcrumb"><a href="/">Operations hub</a><span aria-hidden="true">/</span><a href="/mini-robos">Mini Robos</a></nav></header>
    <main class="stack">
        <div><h1 id="title">Mini Robos</h1><p id="subtitle" class="muted">Agent control room</p></div>
        <p id="notice" role="status">Loading Mini Robos…</p>
        <section class="stack" id="content" aria-label="Mini Robos"></section>
    </main>
    <dialog id="confirm-recipients" aria-labelledby="confirm-title">
        <form method="dialog" class="stack">
            <h2 id="confirm-title">Confirm recipient changes</h2>
            <div id="recipient-diff" class="diff"></div>
            <div class="actions"><button value="cancel" autofocus>Cancel</button><button value="confirm" class="primary">Confirm recipients</button></div>
        </form>
    </dialog>
    <script>
        const byId = id => document.getElementById(id);
        const content = byId('content');
        const notice = byId('notice');
        const labels = { failing: 'Failing', missed: 'Missed', late: 'Late', no_signal: 'No signal', paused: 'Paused', on_track: 'On track' };
        const words = value => value ? String(value).replaceAll('_', ' ') : '—';
        const timeFormat = new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kolkata' });
        const time = value => value ? timeFormat.format(new Date(value)) + ' IST' : '—';
        const pretty = value => JSON.stringify(value, null, 2);
        const slug = location.pathname.split('/').filter(Boolean)[1];
        const agentUrl = slug ? '/agents/' + encodeURIComponent(slug) : null;
        const tabNames = ['Overview', 'Rules & prompt', 'Runs', 'Audit'];
        let selected = 'Overview';
        let requestVersion = 0;
        let agent;
        let agents = [];
        let selectedStatus = '';
        let listing;
        let filters;

        function el(tag, value, className) {
            const node = document.createElement(tag);
            if (value != null) node.textContent = value;
            if (className) node.className = className;
            return node;
        }

        function group(className, ...nodes) {
            const node = el('div', null, className);
            node.append(...nodes);
            return node;
        }

        function button(label, handler, className) {
            const button = el('button', label, className);
            button.type = 'button';
            button.addEventListener('click', async () => {
                button.disabled = true;
                try { await handler(); }
                catch (error) { notice.textContent = error.message; }
                finally { button.disabled = false; }
            });
            return button;
        }

        function link(url, label) {
            const anchor = el('a', label);
            anchor.href = url;
            return anchor;
        }

        function sourceLink(url) {
            try {
                const target = new URL(url);
                if (!['http:', 'https:'].includes(target.protocol)) return null;
                const node = link(target.href, 'Open source');
                node.target = '_blank';
                node.rel = 'noopener noreferrer';
                return node;
            } catch { return null; }
        }

        function label(text, control) {
            const node = el('label', text);
            node.append(control);
            return node;
        }

        function schedule(value) {
            if (!value) return 'Schedule unknown';
            return value.kind === 'interval' ? 'Every ' + value.minutes + ' min'
                : 'Daily at ' + value.times.join(', ') + ' (' + value.tz + ')';
        }

        function statusNode(status) {
            const dot = el('span', null, 'dot ' + status);
            dot.setAttribute('aria-hidden', 'true');
            const node = el('span');
            node.append(dot, document.createTextNode(labels[status] || words(status)));
            return node;
        }

        function timeline(slots) {
            const band = group('timeline');
            const names = [];
            for (let index = 0; index < 14; index++) {
                const slot = slots[index - (14 - slots.length)];
                const marker = el('span', null, 'dot square' + (slot ? ' ' + slot.status : ''));
                marker.title = slot ? time(slot.slot) + ' · ' + labels[slot.status] : 'No scheduled slot';
                if (slot) names.push(marker.title);
                band.append(marker);
            }
            band.setAttribute('role', 'img');
            band.setAttribute('aria-label', names.length ? names.join('; ') : 'No run history');
            return band;
        }

        function profile(items) {
            const list = el('dl');
            for (const [name, value] of items) {
                const detail = el('dd');
                detail.append(value instanceof Node ? value : String(value ?? '—'));
                list.append(el('dt', name), detail);
            }
            return list;
        }

        async function api(path, method = 'GET', body) {
            const token = localStorage.getItem('adoptima_token');
            const headers = token ? { Authorization: 'Bearer ' + token } : {};
            if (body !== undefined) headers['Content-Type'] = 'application/json';
            const response = await fetch('/api/mini-robos' + path, { method, headers, cache: 'no-store',
                body: body === undefined ? undefined : JSON.stringify(body) });
            if (response.status === 401) {
                localStorage.removeItem('adoptima_token');
                location.href = '/';
                throw new Error('Sign in to open Mini Robos.');
            }
            const result = await response.json();
            if (!response.ok) {
                const detail = result.detail;
                const error = new Error(typeof detail === 'string' ? detail : detail?.message ||
                    (Array.isArray(detail) ? detail.map(item => item.msg).join(' ') : 'The request failed.'));
                error.status = response.status;
                error.detail = detail;
                throw error;
            }
            return result;
        }

        function setOptions(select, values) {
            const chosen = select.value;
            const title = select.options[0].textContent;
            select.replaceChildren(new Option(title, ''), ...Array.from(values).sort().map(value => new Option(value, value)));
            if (Array.from(select.options).some(option => option.value === chosen)) select.value = chosen;
        }

        function renderList() {
            const statusBar = byId('statuses');
            statusBar.replaceChildren(...[['', 'All'], ...Object.entries(labels)].map(([value, name]) => {
                const count = agents.filter(row => !value || row.status === value).length;
                const control = button(name + ' (' + count + ')', () => {
                    selectedStatus = value;
                    renderList();
                    statusBar.querySelector('[aria-pressed="true"]').focus();
                });
                control.setAttribute('aria-pressed', String(value === selectedStatus));
                return control;
            }));
            const query = filters.search.value.trim().toLocaleLowerCase();
            const rows = agents.filter(row => (!selectedStatus || row.status === selectedStatus)
                && (!filters.client.value || (row.client || 'Unassigned') === filters.client.value)
                && (!filters.type.value || words(row.type) === filters.type.value)
                && (!filters.source.value || words(row.runs_on) === filters.source.value)
                && (!query || (row.name + ' ' + (row.client || '') + ' ' + row.slug).toLocaleLowerCase().includes(query)));
            listing.replaceChildren(...rows.map(row => {
                const title = el('h2');
                title.append(link('/mini-robos/' + encodeURIComponent(row.slug), row.name));
                const last = row.last_run ? time(row.last_run.started_at) + ' · ' + words(row.last_run.status) : 'No run reported';
                return group('agent-row',
                    group('stack compact', title, statusNode(row.status), el('p', row.client || 'Unassigned', 'muted')),
                    group('stack compact', el('p', words(row.type) + ' · ' + words(row.runs_on)), el('p', schedule(row.schedule), 'muted')),
                    group('stack compact', group('', el('span', 'Last run', 'label'), el('span', last)),
                        group('', el('span', 'Next run', 'label'), el('span', time(row.next_run)))),
                    group('stack compact', el('span', 'Last 14 expected runs', 'label'), timeline(row.slots)));
            }));
            if (!rows.length) listing.append(el('p', 'No agents match these filters.', 'muted'));
        }

        function home() {
            const status = group('actions');
            status.id = 'statuses';
            status.setAttribute('aria-label', 'Filter by status');
            filters = {};
            const controls = group('filters');
            for (const [key, title] of [['search', 'Search'], ['client', 'Client'], ['type', 'Type'], ['source', 'Runs on']]) {
                const field = el(key === 'search' ? 'input' : 'select');
                if (key === 'search') field.type = 'search';
                else field.append(new Option('All', ''));
                filters[key] = field;
                field.addEventListener(key === 'search' ? 'input' : 'change', renderList);
                controls.append(label(title, field));
            }
            listing = group('stack');
            content.replaceChildren(status, controls, listing);
            async function refresh() {
                try {
                    ({ agents } = await api('/agents'));
                    setOptions(filters.client, new Set(agents.map(row => row.client || 'Unassigned')));
                    setOptions(filters.type, new Set(agents.map(row => words(row.type))));
                    setOptions(filters.source, new Set(agents.map(row => words(row.runs_on))));
                    renderList();
                    notice.textContent = '';
                } catch (error) {
                    if (error.status === 403) content.replaceChildren();
                    notice.textContent = error.message;
                }
            }
            refresh();
            window.setInterval(refresh, 60000);
        }

        function overview(panel) {
            const source = sourceLink(agent.source_url);
            panel.replaceChildren(el('h2', 'Job profile'), profile([
                ['Client', agent.client || 'Unassigned'], ['Owner', agent.owner || 'Unassigned'],
                ['Type', words(agent.type)], ['Runs on', words(agent.runs_on)], ['Schedule', schedule(agent.schedule)],
                ['Grace period', agent.grace_minutes + ' min'], ['Expects output', agent.expects_output ? 'Yes' : 'No'],
                ['Last run', agent.last_run ? time(agent.last_run.started_at) + ' · ' + words(agent.last_run.status) : '—'],
                ['Next run', time(agent.next_run)], ['Source', source || '—'],
                ...(agent.pause_reason ? [['Pause reason', agent.pause_reason], ['Paused by', agent.paused_by], ['Paused at', time(agent.paused_at)]] : []),
            ]), el('h2', 'Latest error'), el('p', agent.latest_error ||
                (agent.last_run?.output_count === 0 && agent.expects_output ? 'The last run reported zero output.' : 'No error reported.')));
            if (agent.can_edit) panel.append(button('Edit profile', () => profileEditor(panel)));
        }

        function input(value, type = 'text') {
            const field = el('input');
            field.type = type;
            field.value = value ?? '';
            return field;
        }

        function textarea(value, rows = 4) {
            const field = el('textarea');
            field.rows = rows;
            field.value = value ?? '';
            return field;
        }

        function profileEditor(panel) {
            const name = input(agent.name);
            const owner = input(agent.owner);
            const url = input(agent.source_url, 'url');
            const grace = input(agent.grace_minutes, 'number');
            const plan = textarea(pretty(agent.schedule));
            const outputs = input('', 'checkbox');
            outputs.checked = agent.expects_output;
            const live = input('', 'checkbox');
            live.checked = agent.live_sync;
            plan.readOnly = Boolean(agent.job_ref);
            panel.replaceChildren(el('h2', 'Edit job profile'), label('Name', name), label('Owner', owner), label('Source URL', url),
                label('Schedule (JSON)', plan), label('Grace period in minutes', grace),
                group('row', label('Expects output', outputs), label('Live sync', live)),
                group('actions', button('Save profile', async () => {
                    const value = JSON.parse(plan.value || 'null');
                    await api(agentUrl + '/profile', 'PUT', { name: name.value, owner: owner.value || null, source_url: url.value || null,
                        schedule: value, grace_minutes: grace.valueAsNumber, expects_output: outputs.checked, live_sync: live.checked });
                    await detail();
                }, 'primary'), button('Cancel', () => overview(panel))));
        }

        function compared(leftName, left, rightName, right) {
            return [group('', el('h3', leftName), el('pre', left)), group('', el('h3', rightName), el('pre', right))];
        }

        async function publishOrRollback(path) {
            try { await api(path, 'POST', { confirm_recipients: false }); }
            catch (error) {
                if (error.status !== 409 || !error.detail?.to) throw error;
                const dialog = byId('confirm-recipients');
                byId('recipient-diff').replaceChildren(...compared('Current recipients', pretty(error.detail.from),
                    'Proposed recipients', pretty(error.detail.to)));
                const approved = await new Promise(resolve => {
                    dialog.returnValue = '';
                    dialog.addEventListener('close', () => resolve(dialog.returnValue === 'confirm'), { once: true });
                    dialog.showModal();
                });
                if (!approved) return false;
                await api(path, 'POST', { confirm_recipients: true,
                    recipient_diff: { from: error.detail.from, to: error.detail.to } });
            }
            return true;
        }

        async function rules(panel) {
            const { versions } = await api(agentUrl + '/versions');
            const latest = versions.find(row => row.status === 'published');
            const draft = versions.find(row => row.status === 'draft');
            const current = draft || latest || { prompt: '', rules: [], input_source: {}, recipients: [], note: '' };
            const editor = group('stack compact');
            const inputs = {};
            for (const [key, title] of [['prompt', 'Prompt'], ['rules', 'Rules (one per line)'], ['input_source', 'Input source (JSON)'],
                ['recipients', 'Recipients (JSON array)'], ['note', 'Version note']]) {
                const field = textarea(key === 'rules' ? current.rules.join('\n') :
                    ['recipients', 'input_source'].includes(key) ? pretty(current[key]) : current[key]);
                field.readOnly = !agent.can_edit;
                inputs[key] = field;
                editor.append(label(title, field));
            }
            async function save() {
                const body = { prompt: inputs.prompt.value, rules: inputs.rules.value.split('\n').map(s => s.trim()).filter(Boolean),
                    input_source: JSON.parse(inputs.input_source.value), recipients: JSON.parse(inputs.recipients.value), note: inputs.note.value };
                return api(agentUrl + '/draft', 'PUT', body);
            }
            const mode = el('span', agent.live_sync ? 'Live sync' : 'Copy only — edit at source', 'badge');
            const source = sourceLink(agent.source_url);
            panel.replaceChildren(group('row', el('h2', 'Rules & prompt'), mode, ...(source ? [source] : [])), editor);
            if (agent.can_edit) {
                panel.append(group('actions', button('Save draft', async () => { await save(); await rules(panel); notice.textContent = 'Draft saved.'; }),
                    button('Publish', async () => {
                        await save();
                        if (await publishOrRollback(agentUrl + '/publish')) { await rules(panel); notice.textContent = 'Version published.'; }
                    }, 'primary')));
            }
            const diff = group('diff');
            panel.append(el('h2', 'Version history'), diff);
            for (const version of versions) {
                const entries = { ...version };
                const fields = ['prompt', 'rules', 'input_source', 'recipients', 'note'];
                const text = (row, keys) => keys.map(key => words(key) + '\n' +
                    (typeof row[key] === 'string' ? row[key] : pretty(row[key]))).join('\n\n');
                const controls = group('actions', button('Compare', () => {
                    const changed = latest ? fields.filter(key => pretty(latest[key]) !== pretty(entries[key])) : fields;
                    diff.replaceChildren(...compared(latest ? 'Published v' + latest.version : 'No published version',
                        latest && changed.length ? text(latest, changed) : 'No differences',
                        'Version ' + version.version, changed.length ? text(entries, changed) : 'No differences'));
                }));
                if (agent.can_edit && version.status === 'published' && latest?.version !== version.version) {
                    controls.append(button('Roll back', async () => {
                        if (await publishOrRollback(agentUrl + '/versions/' + version.version + '/rollback')) {
                            await rules(panel);
                            notice.textContent = 'A new version was published from version ' + version.version + '.';
                        }
                    }));
                }
                panel.append(group('panel stack compact', el('h3', 'Version ' + version.version + ' · ' + version.status),
                    el('p', version.author + ' · ' + time(version.published_at || version.created_at), 'muted'),
                    el('p', version.note), controls));
            }
        }

        async function history(panel, type, page = 1) {
            const data = await api(agentUrl + '/' + type + '?page=' + page);
            const runs = type === 'runs';
            const headings = runs ? ['Started', 'Finished', 'Result', 'Output', 'Report']
                : ['Date', 'Who', 'Action', 'Details'];
            const table = el('table');
            const line = table.createTHead().insertRow();
            for (const name of headings) {
                const cell = el('th', name);
                cell.scope = 'col';
                line.append(cell);
            }
            const body = table.createTBody();
            for (const record of data[type]) {
                const row = body.insertRow();
                const values = runs ? [time(record.started_at), time(record.finished_at), words(record.status),
                    record.output_count ?? '—', [record.message, record.error].filter(Boolean).join(' · ') || '—']
                    : [time(record.at), record.who, words(record.action), pretty(record.detail)];
                for (const value of values) row.insertCell().textContent = value;
            }
            const previous = button('Previous', () => history(panel, type, page - 1));
            const next = button('Next', () => history(panel, type, page + 1));
            panel.replaceChildren(el('h2', runs ? 'Runs' : 'Audit'), data[type].length ? group('scroll', table) : el('p', 'No entries yet.'),
                group('actions', ...(page > 1 ? [previous] : []), el('span', 'Page ' + page), ...(data.has_next ? [next] : [])));
        }

        async function keys(panel, result = null) {
            result ??= await api(agentUrl + '/keys');
            panel.replaceChildren(el('h2', 'Reporter keys'), button('Create key', async () => {
                const created = await api(agentUrl + '/keys', 'POST');
                await keys(panel, { keys: [{ id: created.id, created_at: created.created_at }, ...result.keys] });
                const key = input(created.key);
                key.readOnly = true;
                key.autocomplete = 'off';
                const actions = group('actions', button('Copy key', async () => {
                    await navigator.clipboard.writeText(key.value);
                    notice.textContent = 'Reporter key copied.';
                }), button('Hide key', () => { key.value = ''; card.remove(); }));
                const card = group('panel stack compact', label('New key · shown once', key), actions);
                panel.prepend(card);
                key.focus();
            }, 'primary'));
            if (!result.keys.length) panel.append(el('p', 'No reporter keys.'));
            for (const entry of result.keys) {
                const row = group('row', el('span', 'Key ' + entry.id + ' · ' + time(entry.created_at)),
                    el('span', entry.revoked_at ? 'Revoked' : 'Active', 'muted'));
                if (!entry.revoked_at) row.append(button('Revoke', async () => {
                    if (!window.confirm('Revoke reporter key ' + entry.id + '?')) return;
                    await api(agentUrl + '/keys/' + entry.id, 'DELETE');
                    await keys(panel);
                }));
                panel.append(row);
            }
        }

        async function detail() {
            const request = ++requestVersion;
            try {
                const data = await api(agentUrl);
                if (request !== requestVersion) return;
                agent = data;
                byId('title').textContent = agent.name;
                byId('subtitle').replaceChildren(statusNode(agent.status));
                document.title = agent.name + ' · Mini Robos';
                const actions = group('actions');
                const tabBar = group('actions');
                const panel = group('panel stack', el('p', 'Loading…'));
                tabBar.setAttribute('role', 'tablist');
                tabBar.setAttribute('aria-label', 'Agent details');
                panel.id = 'agent-panel';
                panel.setAttribute('role', 'tabpanel');
                if (agent.can_edit) {
                    actions.append(button(agent.paused ? 'Resume' : 'Pause', async () => {
                        const message = agent.runs_on === 'ops_app_job' ? 'Enter a reason' : 'Enter a reason for changing monitoring at this control room';
                        const reason = window.prompt(message);
                        if (!reason?.trim()) return;
                        await api(agentUrl + (agent.paused ? '/resume' : '/pause'), 'POST', { reason });
                        await detail();
                    }), button('Keys', () => keys(panel)));
                    if (agent.runs_on === 'ops_app_job' && !agent.paused) {
                        actions.append(button('Run now', async () => {
                            await api(agentUrl + '/run-now', 'POST');
                            notice.textContent = 'Run requested.';
                        }));
                    }
                }
                tabNames.forEach((name, index) => {
                    const tab = button(name, async () => {
                        selected = name;
                        await detail();
                        byId('tab-' + index)?.focus();
                    });
                    tab.id = 'tab-' + index;
                    tab.setAttribute('role', 'tab');
                    tab.setAttribute('aria-controls', panel.id);
                    tab.setAttribute('aria-selected', String(name === selected));
                    tab.tabIndex = name === selected ? 0 : -1;
                    tab.addEventListener('keydown', event => {
                        const step = { ArrowLeft: -1, ArrowRight: 1, Home: -index, End: tabNames.length - 1 - index }[event.key];
                        if (step === undefined) return;
                        event.preventDefault();
                        byId('tab-' + ((index + step + tabNames.length) % tabNames.length)).click();
                    });
                    if (name === selected) panel.setAttribute('aria-labelledby', tab.id);
                    tabBar.append(tab);
                });
                content.replaceChildren(actions, tabBar, panel);
                if (selected === 'Overview') overview(panel);
                if (selected === 'Rules & prompt') await rules(panel);
                if (selected === 'Runs') await history(panel, 'runs');
                if (selected === 'Audit') await history(panel, 'audit');
                notice.textContent = '';
            } catch (error) {
                if (request !== requestVersion) return;
                if (error.status === 403 || error.status === 404) content.replaceChildren();
                notice.textContent = error.message;
            }
        }

        if (slug) detail();
        else home();
    </script>
</body>
</html>
