<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdGuard Admin Portal — Platform Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #080c14;
            --bg-card: rgba(15, 23, 42, 0.8);
            --border-card: rgba(255, 255, 255, 0.1);
            --border-focus: #10b981;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --danger-bg: rgba(220, 38, 38, 0.15);
            --danger-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(14, 165, 233, 0.08) 0%, transparent 50%);
        }

        .admin-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(16px);
            position: relative;
        }

        .admin-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 28px;
        }

        .admin-shield {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(14, 165, 233, 0.15));
            border: 1px solid rgba(16, 185, 129, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: 'DM Sans', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 7px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            font-size: 14px;
            border-radius: 10px;
            padding: 12px 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--border-focus);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #059669);
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            margin-top: 6px;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-alert {
            display: none;
            background: var(--danger-bg);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: var(--danger-text);
            font-size: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            line-height: 1.45;
        }

        .quick-demo {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-secondary);
            font-size: 12px;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .footer-note {
            margin-top: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .footer-note a {
            color: #34d399;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <div class="admin-header">
            <div class="admin-shield">🛡️</div>
            <div class="admin-badge">Admin Access Only</div>
            <h1>AdGuard Admin Portal</h1>
            <p class="subtitle">Platform administration, subscriber account management, and global heuristic controls.</p>
        </div>

        <div id="loginError" class="error-alert"></div>

        <form id="adminLoginForm" onsubmit="event.preventDefault(); doAdminLogin();">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="adminEmail" placeholder="admin@adoptima.ai" required autofocus>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="adminSubmitBtn">Sign In to Admin Console →</button>
        </form>

        <div class="quick-demo">
            <span style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:8px;">Fast Evaluation Access:</span>
            <button class="btn-ghost" onclick="fillAdminDemo()">Fill Admin Demo Credentials</button>
        </div>
    </div>

    <div class="footer-note">
        <span>Are you an AdGuard subscriber? </span>
        <a href="/adguard-landing">Go to Customer Sign In →</a>
    </div>

    <script>
        function fillAdminDemo() {
            document.getElementById('adminEmail').value = 'admin@adoptima.ai';
            document.getElementById('adminPassword').value = 'Admin@123';
        }

        async function doAdminLogin() {
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errBox = document.getElementById('loginError');
            const btn = document.getElementById('adminSubmitBtn');

            errBox.style.display = 'none';

            if (!email || !password) {
                errBox.textContent = 'Please provide both admin email and password.';
                errBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Verifying Admin Privileges...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || 'Login failed. Please check your credentials.');
                }

                const role = (data.user && data.user.role) || '';
                if (role !== 'admin' && role !== 'superadmin') {
                    throw new Error('Access Denied: This account does not have administrator privileges. Please use the Customer Sign In.');
                }

                localStorage.setItem('adoptima_token', data.access_token);
                window.location.href = '/adguard';
            } catch (err) {
                errBox.textContent = err.message;
                errBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In to Admin Console →';
            }
        }
    </script>
</body>
</html>
