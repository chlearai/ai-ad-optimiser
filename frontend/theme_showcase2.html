<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdOptimiser — Layout Showcase (Dark Themes)</title>
<style>
  :root { --radius-sm: 8px; --radius-md: 14px; --radius-lg: 22px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: #04060a; color: #e8edf2; min-height: 100vh;
  }
  .showcase-header { text-align: center; padding: 46px 24px 6px; }
  .showcase-header h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
  .showcase-header p { color: #8b95a5; margin-top: 8px; font-size: 0.95rem; }
  .variants { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 28px; max-width: 1500px; margin: 30px auto 60px; padding: 0 24px; }
  .variant { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid rgba(255,255,255,0.07); background: #07090c; position: relative; }
  .variant-label { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 5; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); padding: 6px 18px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #aab4c4; }
  .frame { scale: 0.62; transform-origin: top center; width: 160%; margin-left: -30%; height: 560px; pointer-events: none; }
  .choose { display: flex; justify-content: center; gap: 10px; padding: 14px; background: #0a0d12; border-top: 1px solid rgba(255,255,255,0.07); }
  .choose button { padding: 9px 22px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); background: transparent; color: #cfd6e0; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
  .choose button:hover { border-color: #10d97e; color: #7cf5c0; }

  /* shared accents */
  .acc { --accent: #10d97e; --accent-glow: rgba(16,217,126,0.3); --accent-grad: linear-gradient(90deg,#34e89e,#0ac770); --accent-soft: rgba(16,217,126,0.12); --accent-text: #7cf5c0; }
  .acc2 { --accent: #3b9eff; --accent-glow: rgba(59,158,255,0.3); --accent-grad: linear-gradient(90deg,#6db6ff,#2f7fe8); --accent-soft: rgba(59,158,255,0.12); --accent-text: #9ccdff; }
  .acc3 { --accent: #a78bfa; --accent-glow: rgba(167,139,250,0.3); --accent-grad: linear-gradient(90deg,#c4a5ff,#8b5cf6); --accent-soft: rgba(167,139,250,0.12); --accent-text: #d5c8ff; }
  .acc4 { --accent: #f5b83d; --accent-glow: rgba(245,184,61,0.3); --accent-grad: linear-gradient(90deg,#ffd166,#e89b1c); --accent-soft: rgba(245,184,61,0.12); --accent-text: #ffd98a; }

  .app { min-height: 940px; font-size: 16px; color: #e8edf2; position: relative; overflow: hidden; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ============ LAYOUT A: Sidebar command center ============ */
  .LA .side {
    position: absolute; inset: 0 auto 0 0; width: 250px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.005));
    border-right: 1px solid rgba(255,255,255,0.07);
    padding: 26px 18px; display: flex; flex-direction: column; gap: 6px;
  }
  .LA .side .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; margin-bottom: 22px; }
  .LA .logo-ic { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-grad); display: grid; place-items: center; color: #041008; font-weight: 900; box-shadow: 0 0 16px var(--accent-glow); }
  .LA .slink { padding: 10px 14px; border-radius: 10px; color: #97a1b2; font-size: 0.92rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .LA .slink.on { background: var(--accent-soft); color: var(--accent-text); border: 1px solid var(--accent-soft); }
  .LA .main { margin-left: 250px; padding: 30px 36px; }
  .LA .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  .LA .topbar h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .LA .btn { padding: 10px 20px; border-radius: 10px; background: var(--accent-grad); color: #06130b; font-weight: 800; font-size: 0.88rem; box-shadow: 0 4px 18px var(--accent-glow); display: inline-block; }
  .LA .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 22px; }
  .LA .stat { background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 20px; }
  .LA .stat .l { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: #79828f; font-weight: 700; }
  .LA .stat .v { font-size: 1.7rem; font-weight: 800; margin-top: 8px; }
  .LA .stat .d { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-top: 6px; }
  .LA .bigcard { background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 22px; }
  .LA .bars { display: flex; align-items: flex-end; gap: 14px; height: 160px; padding-top: 12px; }
  .LA .bar { flex: 1; border-radius: 8px 8px 3px 3px; background: var(--accent-grad); opacity: 0.85; box-shadow: 0 0 14px var(--accent-glow); }
  .LA .bar:nth-child(even) { opacity: 0.45; }
  .LA .xlab { display: flex; gap: 14px; margin-top: 10px; }
  .LA .xlab span { flex: 1; text-align: center; font-size: 0.7rem; color: #79828f; }

  /* ============ LAYOUT B: Top-tab glass panels ============ */
  .LB { background: radial-gradient(1000px 420px at 50% -8%, var(--accent-glow), transparent 65%), #05070a; }
  .LB .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 1px solid rgba(255,255,255,0.07); background: rgba(4,6,10,0.75); }
  .LB .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; }
  .LB .logo-ic { width: 32px; height: 32px; border-radius: 9px; background: var(--accent-grad); display: grid; place-items: center; color: #041008; font-weight: 900; }
  .LB .tabs { display: flex; gap: 6px; margin: 22px 40px 0; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 6px; width: fit-content; }
  .LB .tab { padding: 9px 22px; border-radius: 10px; color: #97a1b2; font-size: 0.88rem; font-weight: 700; }
  .LB .tab.on { background: var(--accent-grad); color: #06130b; box-shadow: 0 2px 14px var(--accent-glow); }
  .LB .content { padding: 26px 40px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
  .LB .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 22px; }
  .LB .glass h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 16px; color: var(--accent-text); }
  .LB .row { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
  .LB .row:last-child { border-bottom: none; }
  .LB .row .k { color: #97a1b2; }
  .LB .donut { width: 130px; height: 130px; border-radius: 50%; margin: 12px auto; background: conic-gradient(var(--accent) 0 68%, rgba(255,255,255,0.08) 68% 100%); display: grid; place-items: center; box-shadow: 0 0 30px var(--accent-glow); }
  .LB .donut::after { content: '68%'; width: 86px; height: 86px; border-radius: 50%; background: #0a0e13; display: grid; place-items: center; font-weight: 800; font-size: 1.25rem; }

  /* ============ LAYOUT C: Data-dense grid (MIS style) ============ */
  .LC { padding: 26px 34px; background: linear-gradient(180deg, #06080d, #04060a); }
  .LC .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .LC .head h2 { font-size: 1.35rem; font-weight: 800; }
  .LC .head .sub { color: #79828f; font-size: 0.85rem; margin-top: 4px; }
  .LC .chips { display: flex; gap: 8px; }
  .LC .chip { padding: 7px 16px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; border: 1px solid rgba(255,255,255,0.09); color: #97a1b2; }
  .LC .chip.on { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-soft); }
  .LC table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; overflow: hidden; }
  .LC th { text-align: left; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: #79828f; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); }
  .LC td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.9rem; }
  .LC tr:last-child td { border-bottom: none; }
  .LC .tot td { font-weight: 800; background: var(--accent-soft); color: var(--accent-text); }
  .LC .spark { display: inline-flex; gap: 3px; align-items: flex-end; height: 22px; }
  .LC .spark i { width: 5px; border-radius: 2px; background: var(--accent); display: block; opacity: .8; }

  /* ============ LAYOUT D: Split hero + activity feed ============ */
  .LD { display: grid; grid-template-columns: 1fr 340px; min-height: 900px; }
  .LD .left { padding: 46px 40px; background: radial-gradient(900px 400px at 20% 0%, var(--accent-glow), transparent 60%); }
  .LD .left h1 { font-size: 2.5rem; font-weight: 850; letter-spacing: -0.03em; line-height: 1.12; margin-top: 18px; }
  .LD .grad { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .LD .left p { color: #8b95a5; margin-top: 14px; line-height: 1.6; max-width: 560px; }
  .LD .pill { display: inline-flex; padding: 7px 16px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 0.8rem; font-weight: 700; border: 1px solid var(--accent-soft); }
  .LD .ctas { margin-top: 26px; display: flex; gap: 12px; }
  .LD .b1 { padding: 12px 24px; border-radius: 12px; background: var(--accent-grad); color: #06130b; font-weight: 800; box-shadow: 0 6px 24px var(--accent-glow); }
  .LD .b2 { padding: 12px 24px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); color: #dbe2ea; font-weight: 600; }
  .LD .metrics { display: flex; gap: 40px; margin-top: 50px; }
  .LD .m .v { font-size: 1.8rem; font-weight: 800; color: var(--accent-text); }
  .LD .m .k { font-size: 0.78rem; color: #79828f; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
  .LD .right { border-left: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.015); padding: 30px 24px; }
  .LD .right h3 { font-size: 0.95rem; color: var(--accent-text); font-weight: 700; margin-bottom: 18px; }
  .LD .feed { display: flex; flex-direction: column; gap: 14px; }
  .LD .fi { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); }
  .LD .fi .ic { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-size: 0.85rem; flex-shrink: 0; }
  .LD .fi .t { font-size: 0.85rem; font-weight: 600; }
  .LD .fi .s { font-size: 0.75rem; color: #79828f; margin-top: 3px; }
</style>
</head>
<body>

<div class="showcase-header">
  <h1>AdOptimiser Layout Showcase</h1>
  <p>Four different layout patterns — pick the structure you like, then a color from the first showcase.</p>
</div>

<div class="variants" id="variants"></div>

function appD() { return `

const layouts = [
  { id: 'A', name: 'Sidebar Command Center', fn: appA },
  { id: 'B', name: 'Top-Tab Glass Panels', fn: appB },
  { id: 'C', name: 'Data-Dense MIS Grid', fn: appC },
  { id: 'D', name: 'Split Hero + Live Feed', fn: appD },
];

document.getElementById('variants').innerHTML = layouts.map(l => `
  <div class="variant">
    <div class="variant-label">${l.id} — ${l.name}</div>
    <div class="frame">${l.fn()}</div>
    <div class="choose">
      <button onclick="openFull('${l.id}')">Open Full Preview</button>
    </div>
  </div>
`).join('');

function openFull(id) {
  const l = layouts.find(x => x.id === id);
  const w = window.open('', '_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>Layout ${id}</title><style>${document.querySelector('style').innerHTML}</style></head><body style="margin:0"><script>${l.fn.toString()}<\/script><script>document.body.innerHTML = ${l.fn.toString()}();<\/script></body></html>`);
  w.document.close();
}
</script>
</body>
</html>
