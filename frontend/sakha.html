<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sakha · ChlearSakhaaOps AI</title>
    <script>
        document.documentElement.classList.toggle('dark-mode', localStorage.getItem('adoptima_theme') === 'dark');
    </script>
    <style>
        :root {
            --color-bg-page: #ffffff;
            --color-bg-sidebar: #fafaf9;
            --color-bg-card: #fafaf9;
            --color-bg-card-hover: #f5f5f4;
            --color-bg-input: #ffffff;
            --color-bg-modal: #ffffff;
            --color-bg-tooltip: #1c1917;

            --color-border: #e7e5e4;
            --color-border-strong: #d6d3d1;
            --color-border-input: #d6d3d1;
            --color-border-focus: #d97706;

            --color-text-primary: #1c1917;
            --color-text-secondary: #57534e;
            --color-text-muted: #a8a29e;
            --color-text-on-accent: #ffffff;
            --color-text-on-tooltip: #fafaf9;

            --color-accent: #d97706;
            --color-accent-hover: #b45309;
            --color-accent-light: #fef3c7;
            --color-accent-text: #92400e;

            --color-success: #059669;
            --color-success-light: #d1fae5;
            --color-success-text: #065f46;

            --color-danger: #dc2626;
            --color-danger-light: #fee2e2;
            --color-danger-text: #991b1b;

            --color-warning: #d97706;
            --color-warning-light: #fef3c7;
            --color-warning-text: #92400e;

            --color-info: #2563eb;
            --color-info-light: #dbeafe;
            --color-info-text: #1e40af;

            --color-purple: #7c3aed;
            --color-purple-light: #ede9fe;
            --color-purple-text: #5b21b6;

            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);

            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;

            --overlay-bg: rgba(0,0,0,0.4);
        }

        html.dark-mode {
            --color-bg-page: #131009;
            --color-bg-sidebar: #151310;
            --color-bg-card: #292524;
            --color-bg-card-hover: #33302e;
            --color-bg-input: #292524;
            --color-bg-modal: #292524;
            --color-bg-tooltip: #fafaf9;

            --color-border: #3d3937;
            --color-border-strong: #57534e;
            --color-border-input: #57534e;
            --color-border-focus: #f59e0b;

            --color-text-primary: #fafaf9;
            --color-text-secondary: #d6d3d1;
            --color-text-muted: #78716c;
            --color-text-on-accent: #ffffff;
            --color-text-on-tooltip: #1c1917;

            --color-accent: #f59e0b;
            --color-accent-hover: #d97706;
            --color-accent-light: rgba(245,158,11,0.12);
            --color-accent-text: #fbbf24;

            --color-success: #34d399;
            --color-success-light: rgba(52,211,153,0.12);
            --color-success-text: #6ee7b7;

            --color-danger: #f87171;
            --color-danger-light: rgba(248,113,113,0.12);
            --color-danger-text: #fca5a5;

            --color-warning: #fbbf24;
            --color-warning-light: rgba(251,191,36,0.12);
            --color-warning-text: #fde68a;

            --color-info: #60a5fa;
            --color-info-light: rgba(96,165,250,0.12);
            --color-info-text: #93bbfd;

            --color-purple: #a78bfa;
            --color-purple-light: rgba(167,139,250,0.12);
            --color-purple-text: #c4b5fd;

            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.4);

            --overlay-bg: rgba(0,0,0,0.6);
        }
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; background: var(--color-bg-page); color: var(--color-text-primary); font: 1rem/1.5 system-ui, sans-serif; }
        a { color: var(--color-accent-text); text-underline-offset: .2em; }
        :focus-visible { outline: 3px solid var(--color-border-focus); outline-offset: 3px; }
        header { border-bottom: 1px solid var(--color-border); background: var(--color-bg-sidebar); }
        nav, main { width: min(100% - 2rem, 76rem); margin-inline: auto; }
        nav { display: flex; align-items: center; flex-wrap: wrap; gap: .75rem; padding-block: 1rem; }
        main { padding-block: 2rem 4rem; }
        h1, h2, h3, p { margin: 0; }
        h1 { font-size: clamp(1.75rem, 4vw, 2.75rem); line-height: 1.15; overflow-wrap: anywhere; }
        h2 { font-size: 1.125rem; }
        h3 { font-size: 1rem; }
        .title { margin-bottom: 1.25rem; }
        .title p, .secondary { color: var(--color-text-secondary); }
        .title p { margin-top: .5rem; }
        .badge { display: inline-block; width: fit-content; max-width: 100%; padding: .25rem .625rem; border-radius: var(--radius-sm); font-size: .8125rem; font-weight: 700; }
        .amber { color: var(--color-warning-text); background: var(--color-warning-light); }
        .red { color: var(--color-danger-text); background: var(--color-danger-light); }
        .green { color: var(--color-success-text); background: var(--color-success-light); }
        .title .badge { margin-top: .625rem; }
        .stack { display: grid; gap: 1rem; }
        .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 27rem), 1fr)); }
        .panel, .tile { min-width: 0; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 1rem; }
        .panel > h2 { margin-bottom: .75rem; }
        .tile { background: var(--color-bg-card); }
        .tile h2 { font-size: 1.25rem; }
        .tile p { margin-top: .75rem; }
        .tile-head { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
        .tile > .badge { margin-top: .5rem; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8rem), 1fr)); gap: .75rem; margin: 0; }
        .metrics > div { padding: .75rem; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg-card); }
        .tile .metrics { margin-top: 1rem; }
        dt { font-size: .875rem; color: var(--color-text-secondary); }
        dd { margin: .25rem 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
        form { display: flex; flex-wrap: wrap; align-items: end; gap: .75rem; }
        label { display: grid; gap: .25rem; font-size: .875rem; font-weight: 650; }
        input, select, button { max-width: 100%; font: inherit; color: inherit; border: 1px solid var(--color-border-input); border-radius: var(--radius-sm); padding: .5rem .625rem; background: var(--color-bg-input); }
        select { max-width: 15rem; }
        button { font-weight: 700; cursor: pointer; background: var(--color-bg-card); }
        button:hover { background: var(--color-bg-card-hover); }
        .table-wrap { overflow: auto; }
        table { border-collapse: collapse; width: 100%; font-size: .875rem; }
        th, td { text-align: left; vertical-align: top; padding: .5rem; border-bottom: 1px solid var(--color-border); overflow-wrap: anywhere; }
        th { color: var(--color-text-secondary); }
        td:first-child, th:first-child { padding-left: 0; }
        meter { width: min(12rem, 22vw); vertical-align: middle; accent-color: var(--color-accent); }
        .radar { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
        .radar li { padding: .75rem; border-radius: var(--radius-md); background: var(--color-bg-card); }
        .radar h3, .radar p { margin-top: .25rem; overflow-wrap: anywhere; }
        .status { margin-bottom: 1rem; }
        .status:empty { display: none; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Breadcrumb"><a href="/">Operations hub</a><span aria-hidden="true">/</span><a href="/sakha" aria-current="page" id="sakha-link">Sakha</a></nav>
    </header>
    <main>
        <div class="title">
            <h1 id="title">Sakha</h1>
            <p id="subtitle">Lead-to-booking command centre</p>
            <span id="sample" class="badge amber" hidden>Sample data — not live CRM figures</span>
        </div>
        <p class="status" id="status" role="status">Loading Sakha…</p>
        <div class="stack">
            <div id="radar" hidden></div>
            <form id="filters" hidden>
                <label>From <input name="from" type="date" required></label>
                <label>To <input name="to" type="date" required></label>
                <label>Sales person <select name="owner"><option value="">Everyone</option></select></label>
                <button type="submit">Apply filters</button>
            </form>
            <div id="content" class="stack"></div>
        </div>
    </main>
    <script>
        const byId = id => document.getElementById(id);
        const filters = byId('filters');
        const status = byId('status');
        const sampleLabel = byId('sample').textContent;
        const path = location.pathname.split('/').filter(Boolean);
        const endpoint = path.length > 1 ? '/clients/' + encodeURIComponent(path[1]) + '/dashboard' : '/clients';
        const timeFormat = new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Kolkata' });
        const numbers = new Intl.NumberFormat('en-IN');
        const textTime = value => value ? timeFormat.format(new Date(value)) + ' IST' : 'Pending first sync';
        const figure = value => value == null ? '—' : numbers.format(value);
        const minutes = value => value == null ? '—' : figure(value) + ' min';
        const healthLabels = { red: 'Needs action', amber: 'Needs attention', green: 'Healthy' };
        let activeRequest;
        let appliedFilters = new URLSearchParams(location.search);

        function node(tag, value, className) {
            const element = document.createElement(tag);
            if (value != null) element.textContent = value;
            if (className) element.className = className;
            return element;
        }

        function badge(value, tone) {
            return node('span', value, 'badge ' + tone);
        }

        function metrics(items) {
            const list = node('dl', null, 'metrics');
            for (const [label, value] of items) {
                const item = node('div');
                item.append(node('dt', label), node('dd', value));
                list.append(item);
            }
            return list;
        }

        function panel(title, ...children) {
            const section = node('section', null, 'panel');
            section.append(node('h2', title), ...children);
            return section;
        }

        function table(labels, rows, empty) {
            if (!rows.length) return node('p', empty, 'secondary');
            const wrap = node('div', null, 'table-wrap');
            const table = node('table');
            const header = table.createTHead().insertRow();
            for (const label of labels) {
                const cell = node('th', label);
                cell.scope = 'col';
                header.append(cell);
            }
            const body = table.createTBody();
            for (const row of rows) {
                const tr = body.insertRow();
                for (const value of row) {
                    const cell = tr.insertCell();
                    if (value instanceof Node) cell.append(value);
                    else cell.textContent = value ?? '—';
                }
            }
            wrap.append(table);
            return wrap;
        }

        function renderClients({clients}) {
            const grid = node('div', null, 'grid');
            for (const client of clients) {
                const tile = node('article', null, 'tile');
                const link = node('a', client.display_name);
                link.href = '/sakha/' + encodeURIComponent(client.slug);
                const title = node('h2');
                title.append(link);
                const head = node('div', null, 'tile-head');
                head.append(title, badge(healthLabels[client.health], client.health));
                tile.append(head);
                if (client.data_mode === 'sample') tile.append(badge(sampleLabel, 'amber'));
                const value = metric => client.last_sync_at ? figure(metric) : '—';
                tile.append(metrics([
                    ['Leads today', value(client.leads_today)], ['Leads this month', value(client.leads_month)],
                    ['Median first contact', minutes(client.median_first_contact_minutes)],
                    ['Site visits this month', value(client.site_visits_month)], ['Bookings this month', value(client.bookings_month)],
                    ['Open issues', figure(client.open_issue_count)],
                ]), node('p', 'Last synced · ' + textTime(client.last_sync_at), 'secondary'));
                grid.append(tile);
            }
            byId('content').replaceChildren(clients.length ? grid : node('p', 'No Sakha clients are assigned to your account.'));
        }

        function renderRadar(issues) {
            const radar = byId('radar');
            const list = node('ul', null, 'radar');
            for (const issue of issues) {
                const item = node('li');
                item.append(badge(healthLabels[issue.severity], issue.severity), node('h3', issue.title),
                    node('p', issue.detail), node('p', figure(issue.affected_count) + ' affected · Since ' + textTime(issue.first_seen), 'secondary'),
                    node('p', issue.fix_hint));
                list.append(item);
            }
            radar.replaceChildren(panel('Issue radar', issues.length ? list : node('p', 'No open issues.')));
            radar.hidden = false;
        }

        function stages(pipelines) {
            return pipelines.map(pipeline => {
                const max = Math.max(1, ...pipeline.stages.map(stage => stage.count));
                const rows = pipeline.stages.map(stage => {
                    const meter = node('meter');
                    meter.max = max;
                    meter.value = stage.count;
                    meter.setAttribute('aria-hidden', 'true');
                    return [stage.stage, figure(stage.count), meter, figure(stage.drop_off)];
                });
                const section = node('div');
                section.append(node('h3', pipeline.pipeline), table(
                    ['Stage', 'Deals', 'Volume', 'Drop-off from previous stage'], rows, 'No stages available.'
                ));
                return section;
            });
        }

        function updateFilters(data) {
            if (filters.hidden) {
                filters.elements.from.value = data.from;
                filters.elements.to.value = data.to;
            }
            if (filters.hidden || filters.elements.owner.dataset.options !== JSON.stringify(data.owners)) {
                const owner = filters.elements.owner;
                const selection = filters.hidden ? data.owner : owner.value;
                owner.replaceChildren(new Option('Everyone', ''),
                    ...data.owners.map(person => new Option(person.name, person.id)));
                if (selection && !Array.from(owner.options).some(option => option.value === selection)) {
                    owner.add(new Option('Selected sales person', selection));
                }
                owner.value = selection || '';
                owner.dataset.options = JSON.stringify(data.owners);
            }
            filters.hidden = false;
        }

        function renderDashboard(data) {
            byId('title').textContent = data.display_name;
            byId('subtitle').textContent = 'Last synced · ' + textTime(data.last_sync_at);
            byId('sample').hidden = data.data_mode !== 'sample';
            document.title = data.display_name + ' · Sakha';
            byId('sakha-link').removeAttribute('aria-current');
            renderRadar(data.issues);
            updateFilters(data);
            if (!data.last_sync_at) {
                byId('content').replaceChildren(node('p', 'Dashboard figures will appear after the first successful sync.'));
                return;
            }
            const {headline, sources, speed, nurture, visits, bookings, lost_reasons: lost} = data;
            const ownerNames = new Map(data.owners.map(person => [person.id, person.name]));
            const owner = id => ownerNames.get(id) || 'Unassigned';
            const money = item => item.value == null ? '—' : [item.currency, figure(item.value)].filter(Boolean).join(' ');
            const pipelineTables = stages(data.funnel);
            const grid = node('div', null, 'grid');
            grid.append(
                panel('Lead sources and campaigns', table(['Source', 'Campaign', 'Leads'],
                    sources.map(row => [row.source, row.campaign || '—', figure(row.count)]), 'No new leads in this period.')),
                panel('Speed and follow-up', metrics([['Median first contact', minutes(speed.median_minutes)],
                    ['90th percentile', minutes(speed.p90_minutes)], ['Contact target', minutes(speed.target_minutes)],
                    ['Past contact target', figure(speed.over_target)], ['No next step', figure(speed.no_next_step)],
                    ['Overdue tasks', figure(speed.overdue_tasks)]])),
                panel('Nurture activity', metrics([['AI calls connected', figure(nurture.ai_calls_connected)],
                    ['AI calls qualified', figure(nurture.ai_calls_qualified)], ['WhatsApp sent', figure(nurture.whatsapp_sent)],
                    ['WhatsApp read', figure(nurture.whatsapp_read)], ['WhatsApp replies', figure(nurture.whatsapp_replied)],
                    ['Emails sent', figure(nurture.emails_sent)], ['Emails opened', figure(nurture.emails_opened)]])),
                panel('Lost reasons', table(['Reason', 'Deals'],
                    lost.map(row => [row.reason, figure(row.count)]), 'No deals were marked lost in this period.'))
            );
            byId('content').replaceChildren(
                panel('Performance', metrics([['Leads', figure(headline.leads)], ['Contacted', figure(headline.contacted)],
                    ['Qualified', figure(headline.qualified)], ['Site visits completed', figure(headline.site_visits_completed)],
                    ['Bookings', figure(headline.bookings)], ['Lead-to-booking conversion', headline.conversion_pct == null ? '—' : figure(headline.conversion_pct) + '%']])),
                panel('Pipeline funnel', ...(pipelineTables.length ? pipelineTables : [node('p', 'No pipeline data.')])),
                grid,
                panel('Site visits', metrics([['Scheduled', figure(visits.scheduled)], ['Completed', figure(visits.completed)]]),
                    table(['Day (IST)', 'Sales person', 'Scheduled', 'Completed'], visits.by_day_owner.map(row =>
                        [row.date, owner(row.owner_user_id), figure(row.scheduled), figure(row.completed)]), 'No visits in this period.')),
                panel('Confirmed bookings', table(['Lead', 'Sales person', 'Confirmed', 'Value'],
                    bookings.map(row => [row.display_name || '—', owner(row.owner_user_id), textTime(row.booked_at), money(row)]),
                    'No bookings in this period.'))
            );
        }

        async function api(url, signal) {
            const token = localStorage.getItem('adoptima_token');
            const response = await fetch('/api/sakha' + url, { signal, headers: token ? { Authorization: 'Bearer ' + token } : {} });
            if (response.status === 401) {
                localStorage.removeItem('adoptima_token');
                location.href = '/';
                throw new Error('Your session has expired.');
            }
            if (response.status === 403) {
                byId('content').replaceChildren();
                byId('radar').hidden = true;
                byId('title').textContent = 'Sakha';
                byId('subtitle').textContent = 'Lead-to-booking command centre';
                byId('sample').hidden = true;
                filters.hidden = true;
                throw new Error('You do not have access to this Sakha client.');
            }
            if (response.status === 404) throw new Error('This Sakha client could not be found.');
            if (response.status === 400 || response.status === 422) throw new Error('Choose a valid date range.');
            if (!response.ok) throw new Error('Could not load Sakha. Please try again.');
            return response.json();
        }

        async function refresh() {
            activeRequest?.abort();
            const controller = new AbortController();
            activeRequest = controller;
            try {
                const query = appliedFilters.toString();
                const data = await api(endpoint + (query && path.length > 1 ? '?' + query : ''), controller.signal);
                if (controller.signal.aborted) return;
                if (path.length > 1) renderDashboard(data);
                else renderClients(data);
                status.textContent = '';
            } catch (error) {
                if (!controller.signal.aborted) status.textContent = error.message;
            }
        }

        filters.addEventListener('submit', event => {
            event.preventDefault();
            const next = new URLSearchParams(new FormData(filters));
            if (next.get('from') > next.get('to')) {
                status.textContent = 'The end date must be on or after the start date.';
                return;
            }
            appliedFilters = next;
            history.replaceState(null, '', location.pathname + '?' + next);
            refresh();
        });
        refresh();
        window.setInterval(refresh, 60000);
    </script>
</body>
</html>
